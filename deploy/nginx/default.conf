server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # Spring Boot is addressed by container name on the shared Docker network.
    # Buffering is disabled so PDF byte-range responses reach PDF.js unchanged.
    location /api/ {
        proxy_pass http://ai-repair-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # pdfjs-dist ships its worker as .mjs. An explicit JavaScript MIME type is
    # required because browsers reject module workers served as octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React owns client-side routes such as /pre-departure and /on-site.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
